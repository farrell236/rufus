name: Cross-platform CMake Qt

on:
  push:
    paths:
      - '.github/workflows/cmake-qt.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/portable/**'
      - 'src/platform/**'
      - 'src/qt/**'
      - 'tests/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cmake-qt.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/portable/**'
      - 'src/platform/**'
      - 'src/qt/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install compression libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libzstd-dev

      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install bzip2 xz zstd

      - name: Install compression libraries (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static-md bzip2:x64-windows-static-md liblzma:x64-windows-static-md zstd:x64-windows-static-md

      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: cmake --preset dev -DRUFUSPP_STRICT_WARNINGS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake --preset dev
          -DRUFUSPP_STRICT_WARNINGS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build --preset dev --config Debug

      - name: Test
        run: ctest --preset dev -C Debug
